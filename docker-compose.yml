services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clinicalpilot:clinicalpilot@db:5432/clinicalpilot
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - db

  db:
    # PostgreSQL 16 with the pgvector extension, used for paper chunk embeddings.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clinicalpilot
      POSTGRES_USER: clinicalpilot
      POSTGRES_PASSWORD: clinicalpilot
    ports:
      - "5432:5432"
    volumes:
      - clinicalpilot-db:/var/lib/postgresql/data

volumes:
  clinicalpilot-db:
